name: Publisher Mode — Apktool 3.0.3 build

on:
  push:
    branches:
      - feature/publisher-mode-rebased-1.33
    paths:
      - 'smali/**'
      - 'smali_classes*/**'
      - 'res/**'
      - 'assets/**'
      - 'lib/**'
      - 'unknown/**'
      - 'apktool.yml'
      - 'AndroidManifest.xml'
      - '.github/workflows/publisher-mode-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private 1.33 workspace
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 emulator system-images;android-30;default;x86_64'

      - name: Verify isolated Publisher identity and audit hard-coded references
        shell: bash
        run: |
          set -euo pipefail
          APP_ID='com.panyarazzi.alreaderx.publisher'
          OLD_ID='com.onyx.neverland.alreaderpro'
          grep -Fq "package=\"$APP_ID\"" AndroidManifest.xml
          grep -Fq "android:authorities=\"$APP_ID.fileprovider\"" AndroidManifest.xml
          grep -Fq "android:name=\"$APP_ID.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION\"" AndroidManifest.xml
          grep -Fq "<string name=\"app_autority\">$APP_ID.fileprovider</string>" res/values/strings.xml
          echo "Publisher applicationId: $APP_ID"
          echo "Remaining legacy package references in app source (review for intentional external contracts):"
          grep -RIn --binary-files=without-match --include='*.smali' --include='*.xml' "$OLD_ID" smali smali_classes* res 2>/dev/null || true
          echo "Remaining legacy FileProvider authority references:"
          grep -RIn --binary-files=without-match --include='*.smali' --include='*.xml' "$OLD_ID.fileprovider" smali smali_classes* res 2>/dev/null || true

      - name: Download and verify Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            --output apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool_3.0.3.jar" | sha256sum --check
          java -jar apktool_3.0.3.jar --version

      - name: Rebuild decoded APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          java -Xmx4g -jar apktool_3.0.3.jar b . -o dist/AlReaderX-PublisherMode-1.33-unsigned.apk

      - name: Sign test APK with a run-scoped test certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore publisher-test.p12 \
            -storetype PKCS12 \
            -storepass 'publisher-test-only' \
            -keypass 'publisher-test-only' \
            -alias publisher-test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=AlReader X Publisher Test, OU=Testing, O=Local, C=TH'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks publisher-test.p12 \
            --ks-key-alias publisher-test \
            --ks-pass pass:publisher-test-only \
            --key-pass pass:publisher-test-only \
            --out dist/AlReaderX-PublisherMode-1.33-test.apk \
            dist/AlReaderX-PublisherMode-1.33-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            dist/AlReaderX-PublisherMode-1.33-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            dist/AlReaderX-PublisherMode-1.33-test.apk | head -n 1 | tee dist/package-id.txt
          grep -Fq "name='com.panyarazzi.alreaderx.publisher'" dist/package-id.txt

      - name: Prepare emulator smoke test script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/scripts
          cat > .github/scripts/publisher-emulator-smoke-test.sh <<'SMOKE'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="dist/AlReaderX-PublisherMode-1.33-test.apk"
          APP_ID="com.panyarazzi.alreaderx.publisher"
          test -s "$APK"
          collect_install_diagnostics() {
            local label="$1"
            echo "--- Install diagnostics: $label ---"
            adb devices -l > "dist/adb-devices-$label.txt" 2>&1 || true
            adb -s emulator-5554 shell service check package > "dist/package-service-$label.txt" 2>&1 || true
            adb -s emulator-5554 shell getprop > "dist/getprop-$label.txt" 2>&1 || true
            adb -s emulator-5554 shell dumpsys activity processes > "dist/activity-processes-$label.txt" 2>&1 || true
            adb -s emulator-5554 logcat -b all -d -t 5000 -v threadtime > "dist/logcat-$label.txt" 2>&1 || true
            tail -n 500 dist/emulator-boot.log > "dist/emulator-boot-tail-$label.txt" 2>&1 || true
          }
          installed=false
          for attempt in 1 2 3; do
            echo "APK install attempt $attempt/3"
            if adb -s emulator-5554 install --no-incremental -r "$APK"; then
              installed=true
              break
            fi
            collect_install_diagnostics "attempt-$attempt"
            if (( attempt < 3 )); then
              echo "Install failed; reconnecting ADB and rechecking Package Manager before retry."
              adb kill-server || true
              sleep 3
              adb start-server || true
              adb wait-for-device || true
              sleep 10
            fi
          done
          if [[ "$installed" != true ]]; then
            collect_install_diagnostics "final-failure"
            echo "APK installation failed after three attempts; see uploaded emulator diagnostics."
            exit 1
          fi
          adb shell am force-stop "$APP_ID"
          adb logcat -c

          # Grant the emulator-only storage app-op before the first launch.
          # Doing this after launch previously coincided with system_server
          # disappearing on the software-emulated API 30 image.
          adb shell appops set "$APP_ID" MANAGE_EXTERNAL_STORAGE allow
          adb shell service check activity | tee dist/activity-service-before-launch.txt
          adb shell service check package | tee dist/package-service-before-launch.txt

          # Use Android's package-scoped launcher intent. resolve-activity
          # output differs across API 30 package-manager builds; monkey lets
          # Android resolve the installed launcher activity.
          adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
          # TCG-only API 30 emulation can briefly starve System UI after launch.
          # Capture full Android logs, then wait for the launcher to settle.
          sleep 20
          adb shell logcat -b all -d -t 8000 -v threadtime > dist/logcat-after-launch.txt 2>&1 || true
          adb shell service check activity | tee dist/activity-service-after-launch.txt
          adb shell service check package | tee dist/package-service-after-launch.txt
          adb shell pidof "$APP_ID" | tee dist/publisher-pid-after-launch.txt

          # If Android reports a transient System UI ANR, choose Wait and
          # re-check the app instead of mistaking the OS dialog for app UI.
          for retry in 1 2 3; do
            adb shell uiautomator dump /sdcard/publisher-window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/publisher-window.xml > dist/emulator-ui-before-settings.xml
            if grep -Fq "System UI isn't responding" dist/emulator-ui-before-settings.xml; then
              read -r WAIT_X WAIT_Y < <(python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse("dist/emulator-ui-before-settings.xml").getroot()
          for node in root.iter("node"):
              if (node.attrib.get("text") or "").strip().lower() == "wait":
                  nums = [int(x) for x in re.findall(r"-?\d+", node.attrib.get("bounds", ""))]
                  if len(nums) == 4:
                      print((nums[0]+nums[2])//2, (nums[1]+nums[3])//2)
                      break
          else:
              raise SystemExit("System UI ANR dialog has no accessible Wait button")
          PY
          )
              echo "System UI ANR detected; selecting Wait (attempt $retry)."
              adb shell input tap "$WAIT_X" "$WAIT_Y"
              sleep 20
            else
              break
            fi
          done
          adb shell uiautomator dump /sdcard/publisher-window.xml >/dev/null
          adb shell cat /sdcard/publisher-window.xml > dist/emulator-ui-before-settings.xml
          adb shell logcat -b all -d -t 12000 -v threadtime > dist/logcat-before-settings.txt 2>&1 || true
          if grep -Fq "System UI isn't responding" dist/emulator-ui-before-settings.xml; then
            echo "System UI remains unresponsive after Wait recovery attempts."
            exit 1
          fi
          python3 - <<'PY'
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET

          def dump_ui():
              subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/publisher-window.xml"], check=True, stdout=subprocess.DEVNULL)
              with open("dist/emulator-ui-before-settings.xml", "w") as output:
                  subprocess.run(["adb", "shell", "cat", "/sdcard/publisher-window.xml"], check=True, stdout=output)

          def find_options():
              root = ET.parse("dist/emulator-ui-before-settings.xml").getroot()
              for node in root.iter("node"):
                  rid = (node.attrib.get("resource-id") or "").strip()
                  if rid.endswith(":id/buttonOptions") or rid.endswith("/id/buttonOptions"):
                      nums = [int(x) for x in re.findall(r"-?\d+", node.attrib.get("bounds", ""))]
                      if len(nums) == 4:
                          return ((nums[0]+nums[2])//2, (nums[1]+nums[3])//2, rid)
              return None

          options = find_options()
          if not options:
              print("Options button is not visible; tapping the reading area once to reveal reader controls.")
              subprocess.run(["adb", "shell", "input", "tap", "540", "900"], check=True)
              time.sleep(3)
              dump_ui()
              options = find_options()
          if not options:
              raise SystemExit("AlReader Options button (buttonOptions) not found in accessibility tree")
          x, y, rid = options
          print(f"Opening AlReader Options button at ({x},{y}); resource-id={rid!r}")
          with open("dist/settings-tap.txt", "w") as f:
              f.write(f"{x} {y}\n")
          PY
          read -r SETTINGS_X SETTINGS_Y < dist/settings-tap.txt
          adb shell input tap "$SETTINGS_X" "$SETTINGS_Y"
          sleep 8
          # Capture the log AFTER the Options tap. The previous run only saved
          # pre-tap logcat, so it could not reveal a crash triggered by Settings.
          adb shell logcat -b all -d -v threadtime > dist/logcat-after-settings-tap.txt 2>&1 || true
          adb shell pidof "$APP_ID" > dist/publisher-pid-after-settings-tap.txt 2>&1 || true
          adb shell dumpsys activity activities > dist/emulator-activities-after-settings-tap.txt 2>&1 || true
          adb shell uiautomator dump /sdcard/publisher-options.xml >/dev/null 2>&1 || true
          adb shell cat /sdcard/publisher-options.xml > dist/emulator-ui-options.xml 2>&1 || true

          # The Settings dialog must remain open without a verifier/runtime crash.
          adb shell uiautomator dump /sdcard/publisher-settings.xml >/dev/null 2>&1 || true
          adb shell cat /sdcard/publisher-settings.xml > dist/emulator-ui-settings.xml 2>&1 || true
          if ! adb shell pidof "$APP_ID" >/dev/null; then
            echo "Publisher process exited after opening Settings."
            adb logcat -d -v brief
            exit 1
          fi
          if grep -Eiq "Settings|Backup &amp; Restore|Profiles" dist/emulator-ui-settings.xml; then
            echo "Settings dialog content detected in accessibility tree."
          else
            echo "Settings dialog content was not detected after tapping Settings."
            cat dist/emulator-ui-settings.xml
            exit 1
          fi

          # Open the Styles category as a second-stage smoke test. The previous
          # smoke test stopped at the root Settings dialog and missed crashes
          # caused while ListSettingsAdapter builds the style controls.
          python3 - <<'PY'
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET

          def dump_styles_ui():
              subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/publisher-styles.xml"], check=True, stdout=subprocess.DEVNULL)
              with open("dist/emulator-ui-before-styles.xml", "w") as output:
                  subprocess.run(["adb", "shell", "cat", "/sdcard/publisher-styles.xml"], check=True, stdout=output)

          def find_text(label):
              root = ET.parse("dist/emulator-ui-before-styles.xml").getroot()
              for node in root.iter("node"):
                  if (node.attrib.get("text") or "").strip().casefold() == label.casefold():
                      nums = [int(x) for x in re.findall(r"-?\d+", node.attrib.get("bounds", ""))]
                      if len(nums) == 4 and nums[2] > nums[0] and nums[3] > nums[1]:
                          return ((nums[0]+nums[2])//2, (nums[1]+nums[3])//2)
              return None

          styles = None
          for attempt in range(4):
              dump_styles_ui()
              styles = find_text("Styles")
              if styles:
                  break
              print(f"Styles row not visible; scrolling Settings list (attempt {attempt + 1}).")
              subprocess.run(["adb", "shell", "input", "swipe", "600", "1500", "600", "800", "450"], check=True)
              time.sleep(2)
          if not styles:
              raise SystemExit("Styles category was not found in the Settings accessibility tree")
          print(f"Opening Styles category at {styles}")
          with open("dist/styles-tap.txt", "w") as f:
              f.write(f"{styles[0]} {styles[1]}\n")
          PY
          read -r STYLES_X STYLES_Y < dist/styles-tap.txt
          adb shell input tap "$STYLES_X" "$STYLES_Y"
          sleep 8
          adb shell logcat -b all -d -v threadtime > dist/logcat-after-styles-tap.txt 2>&1 || true
          adb shell pidof "$APP_ID" > dist/publisher-pid-after-styles-tap.txt 2>&1 || true
          # Strong and Em are directory sections near the end of the Styles list.
          # Scroll to each section and expand it; checking only the initial viewport
          # misses them because the GridView is vertically scrollable.
          python3 - <<'PY'
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET

          def dump_ui(path="dist/emulator-ui-style-controls.xml"):
              subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/publisher-style-controls.xml"], check=True, stdout=subprocess.DEVNULL)
              with open(path, "w") as output:
                  subprocess.run(["adb", "shell", "cat", "/sdcard/publisher-style-controls.xml"], check=True, stdout=output)
              return ET.parse(path).getroot()

          def find_label(root, label):
              for node in root.iter("node"):
                  if (node.attrib.get("text") or "").strip().casefold() == label.casefold():
                      nums = [int(x) for x in re.findall(r"-?\d+", node.attrib.get("bounds", ""))]
                      if len(nums) == 4 and nums[2] > nums[0] and nums[3] > nums[1]:
                          return ((nums[0]+nums[2])//2, (nums[1]+nums[3])//2)
              return None

          def find_position(root, predicate):
              for node in root.iter("node"):
                  if predicate(node):
                      nums = [int(x) for x in re.findall(r"-?\\d+", node.attrib.get("bounds", ""))]
                      if len(nums) == 4 and nums[2] > nums[0] and nums[3] > nums[1]:
                          return ((nums[0]+nums[2])//2, (nums[1]+nums[3])//2)
              return None

          def has_text(root, value):
              return any((n.attrib.get("text") or "").strip().casefold() == value.casefold() for n in root.iter("node"))

          for label in ("Strong", "Em"):
              position = None
              for attempt in range(14):
                  root = dump_ui()
                  position = find_label(root, label)
                  if position:
                      break
                  print(f"{label} section not visible; scrolling Styles list (attempt {attempt + 1}/14).")
                  subprocess.run(["adb", "shell", "input", "swipe", "600", "1450", "600", "700", "450"], check=True)
                  time.sleep(1.5)
              if not position:
                  root = dump_ui()
                  labels = sorted({(n.attrib.get("text") or "").strip() for n in root.iter("node") if (n.attrib.get("text") or "").strip()})
                  raise SystemExit(f"{label} section not found after scrolling. Visible labels: {labels}")

              print(f"Opening {label} section at {position}")
              subprocess.run(["adb", "shell", "input", "tap", str(position[0]), str(position[1])], check=True)
              time.sleep(3)
              expanded_path = f"dist/emulator-ui-{label.lower()}-expanded.xml"
              root = dump_ui(expanded_path)

              # Selecting a directory row opens a child page. Its title becomes
              # "Styles/Strong" or "Styles/Em"; the original row label is no
              # longer present. Validate the child page and its actual controls.
              expected_title = f"Styles/{label}"
              if not has_text(root, expected_title):
                  visible = sorted({(n.attrib.get("text") or "").strip() for n in root.iter("node") if (n.attrib.get("text") or "").strip()})
                  raise SystemExit(f"{label} child page did not open. Expected {expected_title!r}; visible labels: {visible}")

              required_controls = ("Font", "Size", "Bold", "Italic")
              missing = [name for name in required_controls if not has_text(root, name)]
              if missing:
                  visible = sorted({(n.attrib.get("text") or "").strip() for n in root.iter("node") if (n.attrib.get("text") or "").strip()})
                  raise SystemExit(f"{label} page is open but controls are missing: {missing}. Visible labels: {visible}")

              with open(f"dist/{label.lower()}-section-expanded.txt", "w") as output:
                  output.write(f"Opened {expected_title}; verified controls: {', '.join(required_controls)}\\n")

              if label == "Strong":
                  # Return to the Styles list before locating Em. The directory
                  # row opens a separate child page rather than inline expansion.
                  back = find_position(root, lambda n: n.attrib.get("class") == "android.widget.Button")
                  if not back:
                      raise SystemExit("Back button not found on Styles/Strong child page")
                  subprocess.run(["adb", "shell", "input", "tap", str(back[0]), str(back[1])], check=True)
                  time.sleep(3)
                  root = dump_ui()
                  if not has_text(root, "Styles"):
                      raise SystemExit("Could not return from Styles/Strong to the Styles list")

          print("Strong and Em child pages opened; Font, Size, Bold and Italic controls were verified on both pages.")
          PY
          adb shell logcat -b all -d -v threadtime > dist/logcat-after-styles-tap.txt 2>&1 || true
          adb shell pidof "$APP_ID" > dist/publisher-pid-after-styles-tap.txt 2>&1 || true
          if ! adb shell pidof "$APP_ID" >/dev/null; then
            echo "Publisher process exited while expanding Strong/Em sections."
            adb logcat -d -v brief -s AndroidRuntime:E
            exit 1
          fi

          adb shell dumpsys activity activities | tee dist/emulator-activities.txt
          if ! grep -F "$APP_ID/" dist/emulator-activities.txt; then
            echo "Publisher launcher activity did not become active."
            adb shell dumpsys package "$APP_ID" || true
            adb logcat -d -v brief -s AndroidRuntime:E
            exit 1
          fi
          sleep 20
          if ! adb shell pidof "$APP_ID" >/dev/null; then
            echo "Publisher process exited after launch."
            adb logcat -d -v brief
            exit 1
          fi
          adb shell dumpsys activity activities | tee dist/emulator-activities.txt
          grep -F "$APP_ID/" dist/emulator-activities.txt
          adb logcat -d -v brief -s AndroidRuntime:E | tee dist/emulator-runtime-errors.txt
          if grep -E "FATAL EXCEPTION|Process: $APP_ID|VerifyError|NoClassDefFoundError|Resources\\\$NotFoundException|InflateException" dist/emulator-runtime-errors.txt; then
            echo "Fatal Android runtime error detected."
            exit 1
          fi
          adb exec-out screencap -p > dist/emulator-launch.png
          test -s dist/emulator-launch.png
          SMOKE
          chmod +x .github/scripts/publisher-emulator-smoke-test.sh

      - name: Install and launch APK on Android 11 emulator
        shell: bash
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        run: |
          set -euo pipefail
          AVD_NAME='publisher_api30'
          SERIAL='emulator-5554'
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          echo "no" | "$AVDMANAGER" create avd \
            --name "$AVD_NAME" \
            --path "$ANDROID_AVD_HOME/$AVD_NAME.avd" \
            --package 'system-images;android-30;default;x86_64' \
            --device 'pixel_2' --force

          test -s "$ANDROID_AVD_HOME/$AVD_NAME.ini"
          "$EMULATOR" -list-avds | tee dist/emulator-avds.txt
          grep -Fxq "$AVD_NAME" dist/emulator-avds.txt

          "$EMULATOR" -avd "$AVD_NAME" \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -no-snapshot-save -camera-back none -accel off \
            -memory 3072 -cores 4 \
            > dist/emulator-boot.log 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb -s "$SERIAL" emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          adb start-server
          deadline=$((SECONDS + 720))
          booted=false
          while (( SECONDS < deadline )); do
            state="$(adb -s "$SERIAL" get-state 2>/dev/null || true)"
            if [[ "$state" == 'device' ]]; then
              value="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
              if [[ "$value" == '1' ]]; then
                booted=true
                break
              fi
            else
              adb reconnect offline >/dev/null 2>&1 || true
            fi
            sleep 3
          done

          if [[ "$booted" != true ]]; then
            echo "Android emulator did not become fully booted."
            tail -n 250 dist/emulator-boot.log || true
            adb devices -l || true
            exit 1
          fi

          echo "Android boot completed; waiting for Package Manager service."
          package_ready=false
          package_deadline=$((SECONDS + 360))
          while (( SECONDS < package_deadline )); do
            state="$(adb -s "$SERIAL" get-state 2>/dev/null || true)"
            if [[ "$state" == 'device' ]]; then
              service_status="$(adb -s "$SERIAL" shell service check package 2>/dev/null | tr -d '\\r' || true)"
              if [[ "$service_status" == *'found'* ]]; then
                if adb -s "$SERIAL" shell cmd package list packages >/dev/null 2>&1; then
                  package_ready=true
                  break
                fi
              fi
            fi
            sleep 5
          done

          if [[ "$package_ready" != true ]]; then
            echo "Android Package Manager did not become ready after boot."
            echo "--- ADB devices ---"
            adb devices -l || true
            echo "--- Package service ---"
            adb -s "$SERIAL" shell service check package || true
            echo "--- System services ---"
            adb -s "$SERIAL" shell service list || true
            echo "--- Boot properties ---"
            adb -s "$SERIAL" shell getprop | grep -E 'boot_completed|init.svc.system_server|init.svc.bootanim' || true
            echo "--- Recent Android logs ---"
            adb -s "$SERIAL" logcat -b all -d -t 1200 -v brief || true
            echo "--- Emulator boot log ---"
            tail -n 250 dist/emulator-boot.log || true
            exit 1
          fi

          echo "Package Manager is ready; starting APK smoke test."
          bash .github/scripts/publisher-emulator-smoke-test.sh

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlReaderX-PublisherMode-emulator-diagnostics
          path: |
            dist/adb-devices-*.txt
            dist/package-service-*.txt
            dist/getprop-*.txt
            dist/activity-processes-*.txt
            dist/logcat-*.txt
            dist/emulator-boot*.log
            dist/emulator-ui-*.xml
            dist/settings-tap.txt
            dist/emulator-runtime-errors.txt
            dist/activity-service-*.txt
            dist/package-service-before-launch.txt
            dist/publisher-pid-after-launch.txt
            dist/logcat-after-settings-tap.txt
            dist/publisher-pid-after-settings-tap.txt
            dist/emulator-activities-after-settings-tap.txt
            dist/styles-tap.txt
