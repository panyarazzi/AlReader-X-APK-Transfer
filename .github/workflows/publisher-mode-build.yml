name: Publisher Mode — Apktool 3.0.3 build

on:
  push:
    branches:
      - feature/publisher-mode-rebased-1.33
    paths:
      - 'smali/**'
      - 'smali_classes*/**'
      - 'res/**'
      - 'assets/**'
      - 'lib/**'
      - 'unknown/**'
      - 'apktool.yml'
      - 'AndroidManifest.xml'
      - '.github/workflows/publisher-mode-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private 1.33 workspace
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 emulator system-images;android-30;default;x86_64'

      - name: Verify isolated Publisher identity and audit hard-coded references
        shell: bash
        run: |
          set -euo pipefail
          APP_ID='com.panyarazzi.alreaderx.publisher'
          OLD_ID='com.onyx.neverland.alreaderpro'
          grep -Fq "package=\"$APP_ID\"" AndroidManifest.xml
          grep -Fq "android:authorities=\"$APP_ID.fileprovider\"" AndroidManifest.xml
          grep -Fq "android:name=\"$APP_ID.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION\"" AndroidManifest.xml
          grep -Fq "<string name=\"app_autority\">$APP_ID.fileprovider</string>" res/values/strings.xml
          echo "Publisher applicationId: $APP_ID"
          echo "Remaining legacy package references in app source (review for intentional external contracts):"
          grep -RIn --binary-files=without-match --include='*.smali' --include='*.xml' "$OLD_ID" smali smali_classes* res 2>/dev/null || true
          echo "Remaining legacy FileProvider authority references:"
          grep -RIn --binary-files=without-match --include='*.smali' --include='*.xml' "$OLD_ID.fileprovider" smali smali_classes* res 2>/dev/null || true

      - name: Download and verify Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            --output apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool_3.0.3.jar" | sha256sum --check
          java -jar apktool_3.0.3.jar --version

      - name: Rebuild decoded APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          java -Xmx4g -jar apktool_3.0.3.jar b . -o dist/AlReaderX-PublisherMode-1.33-unsigned.apk

      - name: Sign test APK with a run-scoped test certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore publisher-test.p12 \
            -storetype PKCS12 \
            -storepass 'publisher-test-only' \
            -keypass 'publisher-test-only' \
            -alias publisher-test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=AlReader X Publisher Test, OU=Testing, O=Local, C=TH'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks publisher-test.p12 \
            --ks-key-alias publisher-test \
            --ks-pass pass:publisher-test-only \
            --key-pass pass:publisher-test-only \
            --out dist/AlReaderX-PublisherMode-1.33-test.apk \
            dist/AlReaderX-PublisherMode-1.33-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            dist/AlReaderX-PublisherMode-1.33-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            dist/AlReaderX-PublisherMode-1.33-test.apk | head -n 1 | tee dist/package-id.txt
          grep -Fq "name='com.panyarazzi.alreaderx.publisher'" dist/package-id.txt

      - name: Prepare emulator smoke test script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/scripts
          cat > .github/scripts/publisher-emulator-smoke-test.sh <<'SMOKE'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="dist/AlReaderX-PublisherMode-1.33-test.apk"
          APP_ID="com.panyarazzi.alreaderx.publisher"
          test -s "$APK"
          collect_install_diagnostics() {
            local label="$1"
            echo "--- Install diagnostics: $label ---"
            adb devices -l > "dist/adb-devices-$label.txt" 2>&1 || true
            adb -s emulator-5554 shell service check package > "dist/package-service-$label.txt" 2>&1 || true
            adb -s emulator-5554 shell getprop > "dist/getprop-$label.txt" 2>&1 || true
            adb -s emulator-5554 shell dumpsys activity processes > "dist/activity-processes-$label.txt" 2>&1 || true
            adb -s emulator-5554 logcat -b all -d -t 5000 -v threadtime > "dist/logcat-$label.txt" 2>&1 || true
            tail -n 500 dist/emulator-boot.log > "dist/emulator-boot-tail-$label.txt" 2>&1 || true
          }
          installed=false
          for attempt in 1 2 3; do
            echo "APK install attempt $attempt/3"
            if adb -s emulator-5554 install --no-incremental -r "$APK"; then
              installed=true
              break
            fi
            collect_install_diagnostics "attempt-$attempt"
            if (( attempt < 3 )); then
              echo "Install failed; reconnecting ADB and rechecking Package Manager before retry."
              adb kill-server || true
              sleep 3
              adb start-server || true
              adb wait-for-device || true
              sleep 10
            fi
          done
          if [[ "$installed" != true ]]; then
            collect_install_diagnostics "final-failure"
            echo "APK installation failed after three attempts; see uploaded emulator diagnostics."
            exit 1
          fi
          adb shell am force-stop "$APP_ID"
          adb logcat -c

          # Use Android's package-scoped launcher intent. resolve-activity
          # output differs across API 30 package-manager builds and can yield
          # malformed component strings; monkey delegates resolution to Android.
          adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
          sleep 5
          adb shell dumpsys activity activities | tee dist/emulator-activities.txt
          if ! grep -F "$APP_ID/" dist/emulator-activities.txt; then
            echo "Publisher launcher activity did not become active."
            adb shell dumpsys package "$APP_ID" || true
            adb logcat -d -v brief -s AndroidRuntime:E
            exit 1
          fi
          sleep 20
          if ! adb shell pidof "$APP_ID" >/dev/null; then
            echo "Publisher process exited after launch."
            adb logcat -d -v brief
            exit 1
          fi
          adb shell dumpsys activity activities | tee dist/emulator-activities.txt
          grep -F "$APP_ID/" dist/emulator-activities.txt
          adb logcat -d -v brief -s AndroidRuntime:E | tee dist/emulator-runtime-errors.txt
          if grep -E "FATAL EXCEPTION|Process: $APP_ID|VerifyError|NoClassDefFoundError|Resources\\\$NotFoundException|InflateException" dist/emulator-runtime-errors.txt; then
            echo "Fatal Android runtime error detected."
            exit 1
          fi
          adb exec-out screencap -p > dist/emulator-launch.png
          test -s dist/emulator-launch.png
          SMOKE
          chmod +x .github/scripts/publisher-emulator-smoke-test.sh

      - name: Install and launch APK on Android 11 emulator
        shell: bash
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        run: |
          set -euo pipefail
          AVD_NAME='publisher_api30'
          SERIAL='emulator-5554'
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          echo "no" | "$AVDMANAGER" create avd \
            --name "$AVD_NAME" \
            --path "$ANDROID_AVD_HOME/$AVD_NAME.avd" \
            --package 'system-images;android-30;default;x86_64' \
            --device 'pixel_2' --force

          test -s "$ANDROID_AVD_HOME/$AVD_NAME.ini"
          "$EMULATOR" -list-avds | tee dist/emulator-avds.txt
          grep -Fxq "$AVD_NAME" dist/emulator-avds.txt

          "$EMULATOR" -avd "$AVD_NAME" \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -no-snapshot-save -camera-back none -accel off \
            > dist/emulator-boot.log 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb -s "$SERIAL" emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          adb start-server
          deadline=$((SECONDS + 720))
          booted=false
          while (( SECONDS < deadline )); do
            state="$(adb -s "$SERIAL" get-state 2>/dev/null || true)"
            if [[ "$state" == 'device' ]]; then
              value="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
              if [[ "$value" == '1' ]]; then
                booted=true
                break
              fi
            else
              adb reconnect offline >/dev/null 2>&1 || true
            fi
            sleep 3
          done

          if [[ "$booted" != true ]]; then
            echo "Android emulator did not become fully booted."
            tail -n 250 dist/emulator-boot.log || true
            adb devices -l || true
            exit 1
          fi

          echo "Android boot completed; waiting for Package Manager service."
          package_ready=false
          package_deadline=$((SECONDS + 360))
          while (( SECONDS < package_deadline )); do
            state="$(adb -s "$SERIAL" get-state 2>/dev/null || true)"
            if [[ "$state" == 'device' ]]; then
              service_status="$(adb -s "$SERIAL" shell service check package 2>/dev/null | tr -d '\\r' || true)"
              if [[ "$service_status" == *'found'* ]]; then
                if adb -s "$SERIAL" shell cmd package list packages >/dev/null 2>&1; then
                  package_ready=true
                  break
                fi
              fi
            fi
            sleep 5
          done

          if [[ "$package_ready" != true ]]; then
            echo "Android Package Manager did not become ready after boot."
            echo "--- ADB devices ---"
            adb devices -l || true
            echo "--- Package service ---"
            adb -s "$SERIAL" shell service check package || true
            echo "--- System services ---"
            adb -s "$SERIAL" shell service list || true
            echo "--- Boot properties ---"
            adb -s "$SERIAL" shell getprop | grep -E 'boot_completed|init.svc.system_server|init.svc.bootanim' || true
            echo "--- Recent Android logs ---"
            adb -s "$SERIAL" logcat -b all -d -t 1200 -v brief || true
            echo "--- Emulator boot log ---"
            tail -n 250 dist/emulator-boot.log || true
            exit 1
          fi

          echo "Package Manager is ready; starting APK smoke test."
          bash .github/scripts/publisher-emulator-smoke-test.sh

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlReaderX-PublisherMode-emulator-diagnostics
          path: |
            dist/adb-devices-*.txt
            dist/package-service-*.txt
            dist/getprop-*.txt
            dist/activity-processes-*.txt
            dist/logcat-*.txt
            dist/emulator-boot*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload signed test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlReaderX-PublisherMode-1.33-signed-test
          path: dist/AlReaderX-PublisherMode-1.33-test.apk
          if-no-files-found: error
          retention-days: 7
