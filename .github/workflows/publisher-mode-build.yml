name: Publisher Mode — Apktool 3.0.3 build

on:
  push:
    branches:
      - feature/publisher-mode-rebased-1.33
    paths:
      - 'smali/**'
      - 'smali_classes*/**'
      - 'res/**'
      - 'assets/**'
      - 'lib/**'
      - 'unknown/**'
      - 'apktool.yml'
      - '.github/workflows/publisher-mode-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private 1.33 workspace
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and verify Apktool 3.0.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            --output apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool_3.0.3.jar" | sha256sum --check
          java -jar apktool_3.0.3.jar --version

      - name: Rebuild decoded APK
        shell: bash
        run: |
          mkdir -p dist
          java -Xmx4g -jar apktool_3.0.3.jar b . -o dist/AlReaderX-PublisherMode-1.33-unsigned.apk

      - name: Upload unsigned rebuild for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlReaderX-PublisherMode-1.33-unsigned
          path: dist/AlReaderX-PublisherMode-1.33-unsigned.apk
          if-no-files-found: error
          retention-days: 1
